name: exam-platform

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - internal


  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    restart: "no"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

    depends_on:
      db:
        condition: service_healthy

    networks:
      - internal


  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      APP_URL: ${APP_URL}
      NODE_OPTIONS: --dns-result-order=ipv6first

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

      JWT_SECRET: ${JWT_SECRET}

      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      COOKIE_SECURE: ${COOKIE_SECURE}

      UPLOAD_DIR: /app/public/uploads
      TASK_FILES_DIR: /app/storage/task-files

      ONBOARDING_VIDEO_URL: ${ONBOARDING_VIDEO_URL:-}

      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      REMINDER_CRON_SECRET: ${REMINDER_CRON_SECRET:-}

    volumes:
      - ./storage/uploads:/app/public/uploads
      - ./storage/task-files:/app/storage/task-files

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - internal


volumes:
  postgres_data:


networks:
  internal:
    driver: bridge